<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>TMD · Sin conexión</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, 'Open Sans', sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 20px; margin: 0; }
    p { color: #aaa; margin: 0; max-width: 320px; }
    button { margin-top: 8px; padding: 10px 22px; border: none; border-radius: 20px; background: #e50914; color: #fff; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon-192.png" alt="TMD" />
    <h1>Sin conexión</h1>
    <p>Revisa tu conexión a internet para ver los videos, la wiki y las noticias de TMD.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
